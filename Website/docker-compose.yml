version: '3.8'

services:
  # 1. PostgreSQL 16 with pg_trgm & unaccent extensions
  postgres:
    image: postgres:16-alpine
    container_name: weqaya_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weqaya_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weqaya_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-weqaya_g6pd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./drizzle/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weqaya_admin} -d ${POSTGRES_DB:-weqaya_g6pd}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 for rate-limiting and query caching
  redis:
    image: redis:7-alpine
    container_name: weqaya_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weqaya_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-weqaya_admin}:${POSTGRES_PASSWORD:-weqaya_secret_pass}@postgres:5432/${POSTGRES_DB:-weqaya_g6pd}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long_for_security_123}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
